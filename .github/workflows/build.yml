name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OneLauncher/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('OneLauncher/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config

      - name: Build Rust Launcher
        working-directory: OneLauncher
        run: cargo build --release --workspace

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            OneLauncher/companion/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('OneLauncher/companion/**/*.gradle', 'OneLauncher/companion/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Companion Mod
        working-directory: OneLauncher/companion
        run: |
          chmod +x gradlew
          ./gradlew cleanloom clean build --no-daemon

      - name: Upload Launcher Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-binary-${{ matrix.os }}
          path: |
            OneLauncher/target/release/oneclient*
            OneLauncher/target/release/*.exe

      - name: Upload Companion Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-jar-${{ matrix.os }}
          path: OneLauncher/companion/build/libs/*.jar
