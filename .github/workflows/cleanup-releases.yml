name: Cleanup Old Releases

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching list of releases..."
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse')

          TOTAL=$(echo "$RELEASES" | jq length)
          echo "Total releases found: $TOTAL"

          if [ "$TOTAL" -le 3 ]; then
            echo "Total releases are 3 or fewer. Nothing to delete."
            exit 0
          fi

          # Keep the first 3 (newest), target the rest for deletion
          TO_DELETE=$(echo "$RELEASES" | jq '.[3:]')
          DELETE_COUNT=$(echo "$TO_DELETE" | jq length)

          echo "Keeping the 3 most recent releases."
          echo "Deleting $DELETE_COUNT old releases..."

          echo "$TO_DELETE" | jq -r '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "Failed to delete $tag"
            fi
          done

          echo "Cleanup complete."
