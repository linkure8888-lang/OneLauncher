name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v2.10.0"
        required: true
        default: "v2.10.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Signing key for the updater. Add these in Settings -> Secrets -> Actions:
  #   CARGO_PACKAGER_SIGN_PRIVATE_KEY          = contents of remixclient-updater.key
  #   CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD = (empty for the current key)
  # Without them the release still builds, but the launcher will not auto-update.
  CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
  CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p oneclient_app

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package (NSIS installer)
        run: cargo packager -p oneclient_app --release -f nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in target/release/*setup.exe; do
            cp "$f" "dist/RemixClient_${f##*_}"
          done
          for f in target/release/*setup.exe.sig; do
            cp "$f" "dist/RemixClient_${f##*_}"
          done
          ls -la dist

      - name: Build latest.json
        if: ${{ hashFiles('dist/*.sig') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, subprocess, datetime
          version = subprocess.check_output(
              ["sed", "-nE", "/^\\[workspace.package\\]/,/^\\[/ s/^version *= *\"([^\"]+)\".*/\\1/p", "Cargo.toml"],
              text=True).strip().splitlines()[0]
          exe = glob.glob("dist/RemixClient_*setup.exe")[0]
          sig = exe + ".sig"
          tag = os.environ.get("TAG") or f"v{version}"
          url = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                 f"/releases/download/{tag}/{os.path.basename(exe)}")
          data = {
              "version": version,
              "notes": f"RemixClient {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": {"signature": open(sig).read(), "url": url}},
          }
          with open("dist/latest.json", "w") as fh:
              json.dump(data, fh, indent=2)
          print(open("dist/latest.json").read())
          PY
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remixclient-windows
          path: dist/*
          if-no-files-found: warn

      - name: Publish release
        if: github.event_name == 'push' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: RemixClient ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
