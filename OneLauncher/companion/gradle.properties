# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom 1.19 and Minecraft 26.3 both require a Java 25 JVM to run the build itself,
# so the Gradle daemon is pinned to the local JDK 25 install. Point this at your own JDK 25
# (or set JAVA_HOME to it) on a different machine.
org.gradle.java.home=C:/Users/user/.jdks/temurin-25

# Fabric Properties
# Minecraft 26.x ships unobfuscated, so there are no yarn/intermediary mappings any more:
# no `mappings` dependency is declared and the mod compiles against the official names
# that are already baked into the game jar. Minecraft 26.3 requires Java 25.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4

# Mod Properties
mod_version=1.0.0
maven_group=org.remixclient.companion
archives_base_name=remix-companion

# Dependencies
fabric_version=0.166.2+26.3
