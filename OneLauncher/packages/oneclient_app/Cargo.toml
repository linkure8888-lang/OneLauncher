[package]
name = "oneclient_app"
description = "RemixClient desktop app"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = []

[dependencies]
oneclient_auth.workspace = true
oneclient_cluster.workspace = true
oneclient_common.workspace = true
oneclient_content.workspace = true
oneclient_events.workspace = true
oneclient_java.workspace = true
oneclient_mc.workspace = true
oneclient_polyplus.workspace = true
oneclient_net.workspace = true
oneclient_core.workspace = true
oneclient_db.workspace = true
oneclient_social.workspace = true
chrono.workspace = true
oneclient_macro = { workspace = true, features = ["freya"] }

accesskit.workspace = true
polyio.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sys-locale.workspace = true
sysinfo.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true
directories.workspace = true
dunce.workspace = true
percent-encoding.workspace = true

cargo-packager-updater = "=0.2.3"

rfd.workspace = true
open.workspace = true
url.workspace = true

arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
plusrenderer.workspace = true
freya.workspace = true
freya-core.workspace = true
pulldown-cmark.workspace = true
base64.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
freya-winit.workspace = true
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "RemixClient"
identifier = "org.remixclient.RemixClient"
category = "Game"
publisher = "RemixClient Contributors"
copyright = "© 2026 RemixClient Contributors · GPL-3.0"
homepage = "https://github.com/linkure8888-lang/OneLauncher"
long-description = "RemixClient — improved, offline-first Minecraft launcher (community fork of OneLauncher)"
formats = ["wix", "nsis", "app", "dmg", "deb", "appimage"]
binaries = [{ path = "oneclient_app", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
resources = [
  { src = "icons/generated/Assets.car", target = "Assets.car" },
  # >>> CRT_RESOURCES >>>
  # <<< CRT_RESOURCES >>>
]
